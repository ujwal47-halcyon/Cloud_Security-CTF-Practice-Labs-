<!DOCTYPE html>
<html>
<head><title>AutoElite Image Proxy</title></head>
<body>
    <h1>AutoElite Image Proxy</h1>
    <p>Enter an image URL to load it into our system:</p>
    <form action="/proxy" method="GET">
        <input type="text" name="url" placeholder="http://example.com/image.jpg">
        <button type="submit">Load Image</button>
    </form>
</body>
</html>
